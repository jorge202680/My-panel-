<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 5px; }
        .card { background: #111; padding: 15px; border-radius: 12px; border: 2px solid #ff0033; }
        .lcd { background: #000; color: #00ffcc; font-family: monospace; text-align: center; padding: 8px; border-radius: 5px; border: 1px solid #222; margin-bottom: 10px; font-weight: bold; }
        .top-img { width: 35px; height: 35px; background: #333; display: inline-block; vertical-align: middle; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>TOP SEMANAL</h2>
        <div id="timer-top" class="lcd">20 JUL - 26 JUL</div>
        <p><div class="top-img"></div> 🥇 1°: <span id="t1">---</span></p>
        <p><div class="top-img"></div> 🥈 2°: <span id="t2">---</span></p>
        <p><div class="top-img"></div> 🥉 3°: <span id="t3">---</span></p>
    </div>
    <script>
        let data = JSON.parse(localStorage.getItem('cmdData')) || {};
        document.getElementById('t1').textContent = data.t1 || "---";
        document.getElementById('t2').textContent = data.t2 || "---";
        document.getElementById('t3').textContent = data.t3 || "---";
    </script>
</body>
</html>
